<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Shein Hub</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  
  <!-- Phosphor Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/thin/style.css">
  
  <link rel="stylesheet" href="style.css">
  <style>
    /* ─── CHECKOUT SPECIFIC STYLES ─── */
    .checkout-page {
      padding: 8rem 0;
      min-height: 100vh;
      background: var(--color-bone);
    }
    
    .checkout-header {
      text-align: center;
      margin-bottom: 4rem;
    }
    
    .checkout-header .nav__logo {
      position: static;
      transform: none;
      display: inline-block;
      margin-bottom: 1.5rem;
      font-size: 2rem;
    }
    
    .checkout__grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 5rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    
    .checkout__section-title {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      font-weight: 400;
      margin-bottom: 2rem;
      color: var(--color-espresso);
      border-bottom: 1px solid rgba(140, 115, 85, 0.2);
      padding-bottom: 1rem;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-sand);
      margin-bottom: 0.5rem;
    }
    
    .form-input {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(140, 115, 85, 0.3);
      padding: 1rem;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--color-espresso);
      border-radius: 4px;
      outline: none;
      transition: border-color var(--t-fast);
    }
    
    .form-input:focus {
      border-color: var(--color-espresso);
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    
    .checkout-summary {
      background: var(--color-white);
      padding: 3rem;
      border-radius: 4px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.04);
      border: 1px solid rgba(140, 115, 85, 0.1);
    }
    
    .checkout-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(140, 115, 85, 0.2);
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--color-espresso);
    }
    
    .whatsapp-btn {
      width: 100%;
      margin-top: 2.5rem;
      background: #25D366; /* WhatsApp Green */
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1.25rem;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
    }
    
    .whatsapp-btn:hover {
      background: #1EBE57;
      color: white;
    }
    
    .whatsapp-btn i {
      font-size: 1.4rem;
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-sand);
      margin-bottom: 3rem;
      transition: color var(--t-fast);
    }
    
    .back-link:hover {
      color: var(--color-espresso);
    }

    @media (max-width: 900px) {
      .checkout__grid {
        grid-template-columns: 1fr;
        gap: 3rem;
      }
      .checkout-summary {
        padding: 2rem;
      }
    }
    @media (max-width: 480px) {
      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>
<body>

  <section class="checkout-page">
    <div class="container">
      
      <div class="checkout-header">
        <a href="index.html" class="nav__logo">Shein Hub</a>
        <h1 class="h1-hero" style="font-size: 2.5rem; margin-top: 1rem;">Secure Checkout</h1>
      </div>

      <div class="checkout__grid">
        
        <!-- Left: Form -->
        <div>
          <a href="index.html" class="back-link"><i class="ph-thin ph-arrow-left"></i> Return to Shop</a>
          
          <h2 class="checkout__section-title">Shipping Details</h2>
          
          <form id="whatsapp-checkout-form">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="co-name" class="form-input" required placeholder="Enter your full name">
              </div>
              <div class="form-group">
                <label class="form-label">Phone (WhatsApp)</label>
                <input type="tel" id="co-phone" class="form-input" required placeholder="0300 0000000">
              </div>
            </div>
            
            <div class="form-group">
              <label class="form-label">Complete Address</label>
              <input type="text" id="co-address" class="form-input" required placeholder="House, Street, Area">
            </div>
            
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">City</label>
                <input type="text" id="co-city" class="form-input" required placeholder="e.g. Lahore">
              </div>
              <div class="form-group">
                <label class="form-label">Postal Code (Optional)</label>
                <input type="text" id="co-postal" class="form-input" placeholder="00000">
              </div>
            </div>

            <!-- Mobile: Place button below form directly if needed, but we'll keep it in summary for desktop -->
            <div class="mobile-only-btn" style="display: none;">
              <!-- Handled via flex order or duplicate in CSS if needed, but standard is fine -->
            </div>
        </div>

        <!-- Right: Order Summary -->
        <div>
          <div class="checkout-summary">
            <h2 class="checkout__section-title" style="margin-bottom: 2.5rem;">Order Summary</h2>
            
            <div id="checkout-summary-items">
              <!-- Rendered via JS -->
            </div>
            
            <div class="checkout-total-row">
              <span>Total</span>
              <span id="checkout-summary-total">PKR 0</span>
            </div>
            
            <p style="font-family: var(--font-mono); font-size: 0.65rem; color: var(--color-sand); text-align: center; margin-top: 1.5rem; text-transform: uppercase; letter-spacing: 0.05em;">
              Complete your order via WhatsApp. Our team will confirm and dispatch within 24 hours.
            </p>

            <button type="submit" class="cta whatsapp-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 256 256"><path d="M187.58,144.84l-32-16a8,8,0,0,0-8,.5l-14.69,9.8a40.55,40.55,0,0,1-16-16l9.8-14.69a8,8,0,0,0,.5-8l-16-32A8,8,0,0,0,104,64a40,40,0,0,0-40,40,88.1,88.1,0,0,0,88,88,40,40,0,0,0,40-40A8,8,0,0,0,187.58,144.84ZM152,176a72.08,72.08,0,0,1-72-72A24,24,0,0,1,99.29,80.46l11.48,23-9.7,14.57a8,8,0,0,0-.36,8.44,56.77,56.77,0,0,0,24,24,8,8,0,0,0,8.44-.36l14.57-9.7,23,11.48A24,24,0,0,1,152,176ZM128,24A104,104,0,0,0,36.18,176.88L24.83,210.93a16,16,0,0,0,20.24,20.24l34.05-11.35A104,104,0,1,0,128,24Zm0,192a87.87,87.87,0,0,1-44.06-11.81,8,8,0,0,0-6.54-.67L44,214l10.53-31.59a8,8,0,0,0-.67-6.54A88,88,0,1,1,128,216Z"></path></svg>
              Order via WhatsApp
            </button>
          </div>
          </form> <!-- Form ends here so button is inside form but right column -->
        </div>

      </div>
    </div>
  </section>

  <script src="scripts/main.js"></script>
</body>
</html>
